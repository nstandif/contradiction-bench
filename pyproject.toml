[project]
name = "cbench"
version = "0.1.0"
description = "Compare contradiction detectors (decision models vs NLI models) on ContraDoc"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "protobuf>=5.0",
    "pysbd>=0.3.4",
    "scikit-learn>=1.5",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "transformers>=4.46",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbench"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
